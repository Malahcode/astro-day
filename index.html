<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELVIRA · прогноз</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#1a0b3d; --bg2:#050214; --accent:#f5c86b; --text:#f4efff; --card:rgba(255,255,255,.07); }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { background:var(--bg2); color:var(--text); font-family:Inter, system-ui, sans-serif; overflow-x:hidden; }
  body { min-height:100vh; background:radial-gradient(ellipse at 50% 0%, var(--bg) 0%, var(--bg2) 75%); }
  #stars { position:fixed; inset:0; z-index:0; pointer-events:none; }
  main { position:relative; z-index:1; max-width:520px; margin:0 auto; padding:24px 16px 48px; }
  .fade { opacity:0; transform:translateY(16px); animation:up .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes up { to { opacity:1; transform:none; } }

  .hero { text-align:center; position:relative; height:300px; display:grid; place-items:center; }
  #mandala { position:absolute; width:290px; height:290px; animation:spin 90s linear infinite, bloom 2.2s ease-out; opacity:.85; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes bloom { from { transform:scale(.2) rotate(-90deg); opacity:0; } }
  .name { position:relative; font:700 56px/1 "Cormorant Garamond", serif; letter-spacing:.08em; color:var(--accent);
          text-shadow:0 0 24px color-mix(in srgb, var(--accent) 60%, transparent); }
  .leo { position:relative; font-size:28px; margin-top:6px; color:var(--accent); }
  .date { text-align:center; opacity:.8; font-size:14px; letter-spacing:.04em; margin-top:4px; }

  .theme { text-align:center; font:700 28px/1.2 "Cormorant Garamond", serif; margin:18px 0 8px; }
  .teaser { text-align:center; opacity:.9; line-height:1.55; }
  .quote { margin:22px 0; padding:16px 18px; border-left:3px solid var(--accent); background:var(--card);
           border-radius:0 14px 14px 0; font:500 19px/1.45 "Cormorant Garamond", serif; font-style:italic; min-height:60px; }
  .quote .cursor { display:inline-block; width:1px; background:var(--accent); animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  .nums { display:flex; justify-content:center; gap:10px; margin:10px 0 4px; }
  .num { width:58px; height:58px; display:grid; place-items:center; border-radius:14px; font:700 24px "Cormorant Garamond", serif;
         border:1px solid color-mix(in srgb, var(--accent) 50%, transparent); background:var(--card);
         opacity:0; transform:scale(.4); animation:pop .6s cubic-bezier(.3,1.6,.5,1) forwards; }
  @keyframes pop { to { opacity:1; transform:none; box-shadow:0 0 18px color-mix(in srgb, var(--accent) 45%, transparent); } }
  .color { text-align:center; font-size:14px; opacity:.8; margin-bottom:26px; }

  h2 { font:700 22px "Cormorant Garamond", serif; margin:8px 0 12px; color:var(--accent); }
  .cards { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:12px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none; }
  .cards::-webkit-scrollbar { display:none; }
  .card { flex:0 0 84%; scroll-snap-align:center; background:var(--card); border:1px solid rgba(255,255,255,.1);
          border-radius:20px; padding:18px; line-height:1.55; transition:transform .3s; }
  .card:active { transform:scale(.98); }
  .card b { display:block; font:700 20px "Cormorant Garamond", serif; margin-bottom:8px; color:var(--accent); }
  .dots { display:flex; justify-content:center; gap:6px; margin-bottom:26px; }
  .dot { width:6px; height:6px; border-radius:3px; background:rgba(255,255,255,.3); transition:all .3s; }
  .dot.on { width:18px; background:var(--accent); }

  .tarot { perspective:1000px; width:200px; height:320px; margin:0 auto 12px; cursor:pointer; }
  .tarot-in { position:relative; width:100%; height:100%; transition:transform 1s cubic-bezier(.3,1.3,.5,1); transform-style:preserve-3d; }
  .tarot.open .tarot-in { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; display:grid; place-items:center; text-align:center; padding:16px;
          border:2px solid var(--accent); }
  .back { background:repeating-linear-gradient(45deg, var(--bg) 0 10px, var(--bg2) 10px 20px); font-size:64px; color:var(--accent); }
  .front { transform:rotateY(180deg); background:linear-gradient(160deg, var(--bg), var(--bg2)); font:700 26px "Cormorant Garamond", serif; color:var(--accent); }
  .hint { text-align:center; font-size:13px; opacity:.6; margin-bottom:10px; }
  .tarot-text { line-height:1.55; opacity:0; max-height:0; overflow:hidden; transition:opacity .8s .5s, max-height .8s; }
  .tarot-text.show { opacity:1; max-height:400px; }
  .wish { margin-top:28px; text-align:center; font:500 20px/1.4 "Cormorant Garamond", serif; color:var(--accent); }
  .portrait { position:relative; margin:-24px -16px 6px; aspect-ratio:16/9; overflow:hidden; border-radius:0 0 28px 28px;
              box-shadow:0 12px 44px color-mix(in srgb, var(--accent) 35%, transparent); background:var(--bg); }
  .portrait img { width:100%; height:100%; object-fit:cover; display:block;
                  clip-path:circle(0% at 50% 45%); filter:blur(22px) saturate(0) brightness(1.7); }
  .portrait img.show { animation:reveal 2.8s cubic-bezier(.2,.7,.2,1) forwards; }
  @keyframes reveal { 55% { filter:blur(6px) saturate(.7) brightness(1.25); } to { clip-path:circle(85% at 50% 45%); filter:none; } }
  .portrait::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:0;
                     background:linear-gradient(180deg, transparent 0, rgba(255,255,255,.55) 3%, transparent 9%); }
  .portrait.printing::after { animation:scan 2.6s ease-in-out .2s forwards; }
  @keyframes scan { from { opacity:1; transform:translateY(-12%); } to { opacity:0; transform:translateY(100%); } }
  .portrait.done { animation:glow 1.2s ease-out forwards; }
  @keyframes glow { to { box-shadow:0 0 0 2px var(--accent), 0 12px 60px color-mix(in srgb, var(--accent) 55%, transparent); } }
  .shimmer { position:absolute; inset:0; display:grid; place-items:center; color:var(--accent);
             font:500 20px "Cormorant Garamond", serif; background-size:200% 100%; animation:sh 1.6s linear infinite;
             background-image:linear-gradient(110deg, var(--bg) 30%, color-mix(in srgb, var(--accent) 22%, var(--bg)) 50%, var(--bg) 70%); }
  @keyframes sh { to { background-position:-200% 0; } }
  /* живой фон: две туманности медленно плывут */
  body::before, body::after { content:""; position:fixed; z-index:0; width:70vmax; height:70vmax; border-radius:50%;
    filter:blur(80px); opacity:.35; pointer-events:none; animation:drift 26s ease-in-out infinite alternate; }
  body::before { background:var(--accent); top:-30vmax; left:-25vmax; }
  body::after { background:var(--bg); bottom:-35vmax; right:-30vmax; opacity:.8; animation-duration:34s; }
  @keyframes drift { to { transform:translate(12vmax, 10vmax) scale(1.15); } }
  /* карточки сфер: светящаяся переливающаяся рамка и большая иконка */
  .card { border:1.5px solid transparent; position:relative;
    background:linear-gradient(160deg, rgba(20,10,40,.85), rgba(10,5,25,.9)) padding-box,
               conic-gradient(from var(--a, 0deg), var(--accent), transparent 30%, var(--accent) 60%, transparent 85%, var(--accent)) border-box;
    animation:spinborder 8s linear infinite; box-shadow:0 8px 30px rgba(0,0,0,.35); }
  @property --a { syntax:"<angle>"; inherits:false; initial-value:0deg; }
  @keyframes spinborder { to { --a:360deg; } }
  .card .ico { font-size:40px; display:block; margin-bottom:6px; filter:drop-shadow(0 0 12px var(--accent)); }
  /* заголовки разделов с орнаментом */
  h2 { display:flex; align-items:center; gap:10px; }
  h2::before, h2::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--accent), transparent); }
  /* появление при прокрутке */
  .rv { opacity:0; transform:translateY(24px) scale(.98); transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1); }
  .rv.in { opacity:1; transform:none; }
  /* карта Таро «дышит» и мерцает, пока закрыта */
  .tarot:not(.open) .tarot-in { animation:float 3.2s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(-8px) rotateZ(-1.5deg); } }
  .back { box-shadow:0 0 30px color-mix(in srgb, var(--accent) 45%, transparent) inset, 0 0 24px color-mix(in srgb, var(--accent) 40%, transparent); }
  .wish { animation:breathe 3.5s ease-in-out infinite; }
  @keyframes breathe { 50% { text-shadow:0 0 22px var(--accent); } }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<main id="app"></main>
<script>
const PALETTES = { // variant -> [фон, глубина, акцент]
  1:["#2a1260","#07031a","#f5c86b"], 2:["#123a6b","#030a18","#bfe3ff"], 3:["#0b4a3e","#021210","#7fe0c0"],
  4:["#5a3f7a","#1a1030","#ffc6e6"], 5:["#2b2b2b","#050505","#e6e6e6"], 6:["#3a2a08","#0a0702","#ffcf5a"],
  7:["#5a120a","#140302","#ff8a3d"] };
const SPHERES = [["love","💞 Що шепоче серце?"],["work","🏡 Дім і мої справи"],["money","💰 Грошовий знак дня"],
                 ["health","🌿 Сили для мами"],["power","🦁 Моя суперсила"],["dream","🚀 Час для себе й мрії"],
                 ["week","🔮 Що чекає далі?"]];
const tg = window.Telegram && Telegram.WebApp;
const haptic = s => tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function readDay() { // ?d=<base64url(deflate-raw(json))>; в #… Telegram дописывает свои данные
  const m = (location.search + location.hash).match(/[?&#]d=([\w-]+)/);
  if (!m) throw new Error("no data");
  const b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

function mandala(n, accent) { // симметрия = число дня (минимум 6 лучей)
  const k = Math.max(n, 3) * 2, g = [];
  for (let i = 0; i < k; i++) {
    const a = 360 / k * i;
    g.push(`<g transform="rotate(${a} 150 150)">
      <ellipse cx="150" cy="70" rx="16" ry="52" fill="none" stroke="${accent}" stroke-width="1.2" opacity=".8"/>
      <ellipse cx="150" cy="40" rx="6" ry="18" fill="${accent}" opacity=".35"/>
      <circle cx="150" cy="16" r="3" fill="${accent}"/></g>`);
  }
  return `<svg id="mandala" viewBox="0 0 300 300">${g.join("")}
    <circle cx="150" cy="150" r="118" fill="none" stroke="${accent}" stroke-dasharray="2 6" opacity=".7"/>
    <circle cx="150" cy="150" r="60" fill="none" stroke="${accent}" opacity=".5"/></svg>`;
}

function stars(accent) {
  const c = document.getElementById("stars"), x = c.getContext("2d");
  const fit = () => { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; };
  fit(); addEventListener("resize", fit);
  const s = Array.from({length: 140}, () => ({x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .3,
                                              v: Math.random() * .00012 + .00003, p: Math.random() * 6}));
  (function tick(t) {
    x.clearRect(0, 0, c.width, c.height);
    for (const p of s) {
      p.y -= p.v; if (p.y < 0) p.y = 1;
      x.globalAlpha = .35 + .65 * Math.abs(Math.sin(t / 900 + p.p));
      x.fillStyle = p.r > 1.4 ? accent : "#fff";
      x.beginPath(); x.arc(p.x * c.width, p.y * c.height, p.r * devicePixelRatio, 0, 7); x.fill();
    }
    requestAnimationFrame(tick);
  })(0);
}

function typewrite(el, text) {
  let i = 0; el.innerHTML = '<span></span><span class="cursor">&nbsp;</span>';
  const span = el.firstChild;
  const step = () => { span.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(step, 28); };
  setTimeout(step, 1400);
}

function portrait(url, tries = 0) { // GitHub Pages публикует картинку ~1 мин — ждём и повторяем
  const box = document.getElementById("portrait"), img = new Image();
  img.onload = () => {
    box.innerHTML = ""; box.appendChild(img); box.classList.add("printing");
    requestAnimationFrame(() => img.classList.add("show")); haptic("medium");
    setTimeout(() => box.classList.add("done"), 2800);
  };
  img.onerror = () => { if (tries < 20) setTimeout(() => portrait(url, tries + 1), 6000); else box.remove(); };
  img.src = url + (tries ? "?t=" + tries : "");
}

function render(d) {
  const [bg, bg2, accent] = PALETTES[d.v] || PALETTES[1];
  const r = document.documentElement.style;
  r.setProperty("--bg", bg); r.setProperty("--bg2", bg2); r.setProperty("--accent", accent);
  if (tg) { tg.setBackgroundColor(bg2); tg.setHeaderColor(bg2); }
  const delay = s => `style="animation-delay:${s}s"`;
  document.getElementById("app").innerHTML = `
    ${d.p ? '<div class="portrait" id="portrait"><div class="shimmer">✨ Ваш образ проявляється…</div></div>' : ""}
    <div class="hero">${mandala(d.n, accent)}<div><div class="name fade">ELVIRA</div><div class="leo fade" ${delay(.4)}>♌</div></div></div>
    <div class="date fade" ${delay(.6)}>${esc(d.date_ru)} · ${esc(d.weekday_ru)}, день ${esc(d.planet_gen_ru)}</div>
    <div class="theme fade" ${delay(.8)}>${esc(d.theme)}</div>
    <div class="teaser fade" ${delay(1)}>${esc(d.teaser)}</div>
    <div class="quote fade" ${delay(1.2)} id="quote"></div>
    <div class="nums">${d.lucky.map((n, i) => `<div class="num" style="animation-delay:${1.6 + i * .25}s">${n}</div>`).join("")}</div>
    <div class="color fade" ${delay(2.4)}>🎨 Колір дня: ${esc(d.color)}</div>
    <h2 class="rv">Сфери дня</h2>
    <div class="cards" id="cards">${SPHERES.map(([k, t]) =>
      `<div class="card"><span class="ico">${t.split(" ")[0]}</span><b>${t.split(" ").slice(1).join(" ")}${k === "power" ? ": " + esc(d.trait) : ""}</b>${esc(d[k])}</div>`).join("")}</div>
    <div class="dots" id="dots">${SPHERES.map((_, i) => `<div class="dot${i ? "" : " on"}"></div>`).join("")}</div>
    <h2 class="rv">🃏 Карта дня</h2>
    <div class="tarot" id="tarot"><div class="tarot-in">
      <div class="face back">✦</div><div class="face front">${esc(d.tarot_card)}</div></div></div>
    <div class="hint" id="hint">Торкніться, щоб відкрити карту</div>
    <div class="tarot-text" id="tarotText">${esc(d.tarot)}</div>
    <div class="wish">🌟 ${esc(d.wish)}</div>`;

  if (d.p) portrait(d.p);
  typewrite(document.getElementById("quote"), d.quote);
  const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add("in")), {threshold:.15});
  document.querySelectorAll(".cards, .tarot, .wish, h2").forEach(el => { el.classList.add("rv"); io.observe(el); });
  stars(accent);

  const cards = document.getElementById("cards"), dots = [...document.querySelectorAll(".dot")];
  let last = 0;
  cards.addEventListener("scroll", () => {
    const i = Math.round(cards.scrollLeft / cards.firstElementChild.offsetWidth);
    if (i !== last) { dots[last].classList.remove("on"); dots[i] && dots[i].classList.add("on"); last = i; haptic("light"); }
  });
  document.getElementById("tarot").addEventListener("click", e => {
    const t = e.currentTarget; if (t.classList.contains("open")) return;
    t.classList.add("open"); haptic("heavy");
    document.getElementById("hint").remove();
    document.getElementById("tarotText").classList.add("show");
  });
}

if (tg) { tg.ready(); tg.expand(); }
readDay().then(render).catch(() => {
  document.getElementById("app").innerHTML = '<p style="text-align:center;margin-top:40vh">Прогноз не знайдено ✨</p>';
});
</script>
</body>
</html>
